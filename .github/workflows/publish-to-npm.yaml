name: Publish To npm
on:
  push:
    branches:
      - release
  workflow_dispatch:
jobs:
  publish-to-npm:
    runs-on: ubuntu-latest
    permissions:
      # semantic-release のリリースコミット・タグ push と GitHub Release 作成、gh-pages への push のため
      contents: write
      # @semantic-release/github がリリースに含まれる issue / PR にコメントするため
      issues: write
      pull-requests: write
      # npm の Trusted Publishing (OIDC) でトークンなしに publish するため
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          # rollup.config.ts を Node の型ストリップで読み込むためと、semantic-release 25 の要求 (>= 24.10) のため 24 系を使う
          node-version: "24.x"
      - name: Install
        run: npm install
      - name: Build
        run: npm run build
      - name: Test
        run: npm run test
      - name: Pages
        uses: peaceiris/actions-gh-pages@v3
        if: ${{ github.ref == 'refs/heads/release' }}
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
      - name: Release
        run: npx semantic-release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
